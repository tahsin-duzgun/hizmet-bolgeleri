'use strict';const REGIONS={"1": ["Adana", "Ankara", "Antalya", "Aydın", "Balıkesir", "Bursa", "Çanakkale", "Çorum", "Denizli", "Edirne", "Eskişehir", "Gaziantep", "İstanbul", "İzmir", "Kayseri", "Kocaeli", "Konya", "Manisa", "Mersin", "Muğla", "Sakarya", "Samsun", "Tekirdağ", "Trabzon", "Yalova"], "2": ["Afyonkarahisar", "Bolu", "Çankırı", "Diyarbakır", "Düzce", "Erzincan", "Erzurum", "Giresun", "Hatay", "Isparta", "Kahramanmaraş", "Kırıkkale", "Kırklareli", "Kütahya", "Malatya", "Mardin", "Nevşehir", "Ordu", "Sivas", "Şanlıurfa", "Tokat", "Uşak", "Van", "Yozgat", "Zonguldak"], "3": ["Aksaray", "Amasya", "Artvin", "Bartın", "Bilecik", "Burdur", "Elazığ", "Karabük", "Karaman", "Kastamonu", "Kırşehir", "Niğde", "Osmaniye", "Rize", "Sinop"], "4": ["Adıyaman", "Ağrı", "Ardahan", "Batman", "Bayburt", "Bingöl", "Bitlis", "Gümüşhane", "Hakkâri", "Iğdır", "Kars", "Kilis", "Muş", "Siirt", "Şırnak", "Tunceli"]};const COLORS={1:'#ffffff',2:'#79bcf5',3:'#a1ee7e',4:'#ffa83d'};const NAMES={1:'Beyaz',2:'Mavi',3:'Yeşil',4:'Turuncu'};const LOOKUP=Object.fromEntries(Object.entries(REGIONS).flatMap(([r,cities])=>cities.map(c=>[c,Number(r)])));if(Object.keys(LOOKUP).length!==81)throw Error('81 il doğrulaması başarısız');
const CITY_POS={"Edirne": [125, 154], "Kırklareli": [214, 49], "Tekirdağ": [205, 106], "İstanbul": [349, 116], "Çanakkale": [129, 256], "Balıkesir": [241, 319], "Bursa": [345, 245], "Yalova": [349, 183], "Kocaeli": [428, 144], "Sakarya": [477, 176], "Bilecik": [450, 245], "Düzce": [557, 142], "Bolu": [584, 195], "Zonguldak": [601, 131], "Karabük": [666, 151], "Bartın": [663, 66], "Kastamonu": [752, 93], "Sinop": [873, 71], "Samsun": [982, 118], "Amasya": [950, 176], "Çorum": [851, 211], "Çankırı": [746, 191], "Ankara": [663, 290], "Kırıkkale": [764, 312], "Kırşehir": [805, 357], "Yozgat": [896, 299], "Tokat": [1009, 220], "Ordu": [1103, 157], "Giresun": [1199, 160], "Trabzon": [1306, 151], "Rize": [1415, 115], "Artvin": [1508, 83], "Ardahan": [1605, 78], "Kars": [1610, 174], "Iğdır": [1720, 211], "Ağrı": [1626, 264], "Erzurum": [1474, 252], "Bayburt": [1358, 205], "Gümüşhane": [1268, 196], "Erzincan": [1276, 283], "Tunceli": [1309, 331], "Bingöl": [1412, 349], "Muş": [1511, 353], "Bitlis": [1571, 413], "Van": [1696, 391], "Hakkâri": [1755, 498], "Şırnak": [1572, 529], "Siirt": [1580, 473], "Batman": [1486, 458], "Diyarbakır": [1376, 463], "Mardin": [1465, 548], "Şanlıurfa": [1282, 580], "Adıyaman": [1190, 529], "Malatya": [1184, 449], "Elazığ": [1290, 402], "Sivas": [1090, 305], "Kayseri": [970, 427], "Nevşehir": [858, 407], "Niğde": [868, 505], "Aksaray": [777, 458], "Konya": [662, 493], "Karaman": [745, 597], "Mersin": [783, 648], "Adana": [934, 553], "Osmaniye": [1023, 578], "Kahramanmaraş": [1063, 508], "Gaziantep": [1121, 605], "Kilis": [1087, 641], "Hatay": [1007, 694], "Antalya": [511, 621], "Burdur": [441, 564], "Isparta": [511, 507], "Afyonkarahisar": [487, 429], "Eskişehir": [533, 302], "Kütahya": [385, 337], "Uşak": [356, 428], "Manisa": [249, 392], "İzmir": [181, 451], "Aydın": [233, 543], "Denizli": [346, 548], "Muğla": [298, 609]};const KEY='hizmet-bolgeleri-ipad-v1';let data={};try{data=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){};if(!data||typeof data!=='object')data={};for(const c of Object.keys(LOOKUP)){if(!data[c])data[c]={right:0,wrong:0,missed:false};}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}}const $=id=>document.getElementById(id);const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const sorted=arr=>arr.sort((a,b)=>a.localeCompare(b,'tr'));const shuffled=arr=>arr.sort(()=>Math.random()-.5);
let mode='quiz',filter='all',queue=[],current=null,answered=false,session={right:0,total:0};const tabs=[['quiz','Sınav'],['learn','Öğren'],['missed','Yanlışlarım'],['stats','İstatistik']];function renderTabs(){$('tabs').innerHTML=tabs.map(([id,label])=>`<button class="${mode===id?'active':''}" data-mode="${id}">${label}</button>`).join('');document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>switchMode(b.dataset.mode));}
function switchMode(m){mode=m;renderTabs();if(m==='quiz'||m==='missed')setupQuiz();if(m==='learn')renderLearn();if(m==='stats')renderStats();}function filterOptions(){return `<option value="all">Tüm bölgeler</option>`+[1,2,3,4].map(r=>`<option value="${r}">${r}. Hizmet Bölgesi</option>`).join('');}function pool(){let arr=filter==='all'?Object.keys(LOOKUP):REGIONS[filter];if(mode==='missed')arr=arr.filter(c=>data[c].missed);return shuffled([...arr]);}
function setupQuiz(){filter='all';$('app').innerHTML=`<div class="controls"><label class="toggle">Bölge filtresi <select id="filter">${filterOptions()}</select></label><button class="secondary" id="restart">Soruları karıştır</button></div><p class="subtle center" id="progress"></p><div class="question" id="question"></div><div class="answers" id="answers">${[1,2,3,4].map(r=>`<button data-answer="${r}" style="background:${COLORS[r]}">${r}. Hizmet Bölgesi</button>`).join('')}</div><div class="feedback" id="feedback" aria-live="polite"></div><div class="map-box" id="mapbox"><img src="harita.webp" alt="Türkiye hizmet bölgeleri haritası"><span class="map-marker" id="mapmarker"></span><span class="map-caption" id="mapcaption"></span></div><div class="center"><button class="primary" id="next">Sonraki soru →</button></div>`;$('filter').onchange=e=>{filter=e.target.value;reset()};$('restart').onclick=reset;$('next').onclick=next;document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>answer(Number(b.dataset.answer)));reset();}
function reset(){queue=pool();session={right:0,total:0};next();}function next(){if($('mapbox'))$('mapbox').classList.remove('visible');current=queue.pop()||null;answered=false;const buttons=document.querySelectorAll('[data-answer]');buttons.forEach(b=>{b.disabled=!current;b.classList.remove('correct','wrong')});$('next').disabled=true;if(!current){$('question').textContent='Bu bölüm tamamlandı';$('feedback').textContent=mode==='missed'?'Tekrar çalışılacak yanlışın kalmadı.':'Yeni tur için Soruları karıştır düğmesine dokun.';}else{$('question').textContent=current;$('feedback').textContent='Bu il hangi hizmet bölgesinde?';}progress();}function progress(){$('progress').textContent=`Bu tur: ${session.right}/${session.total} doğru • Kalan: ${queue.length+(current&&!answered?1:0)}`;}function answer(n){if(answered||!current)return;answered=true;const correct=LOOKUP[current],ok=n===correct;data[current][ok?'right':'wrong']++;data[current].missed=!ok;save();session.total++;if(ok)session.right++;document.querySelectorAll('[data-answer]').forEach(b=>{b.disabled=true;if(Number(b.dataset.answer)===correct)b.classList.add('correct');if(!ok&&Number(b.dataset.answer)===n)b.classList.add('wrong')});$('feedback').textContent=ok?'✓ Doğru!':`✗ Yanlış. ${current}: ${correct}. Hizmet Bölgesi (${NAMES[correct]})`;$('feedback').style.color=ok?'#86efac':'#fda4af';$('next').disabled=false;showMap(current,ok);progress();}
function showMap(city,ok){const box=$('mapbox'),marker=$('mapmarker'),caption=$('mapcaption');if(!box||!CITY_POS[city])return;const [x,y]=CITY_POS[city];marker.style.left=(x/1853*100)+'%';marker.style.top=(y/832*100)+'%';marker.style.background=ok?'#22c55e':'#ef4444';marker.style.color=ok?'#22c55e':'#ef4444';caption.textContent=city+' • '+LOOKUP[city]+'. Bölge';box.classList.add('visible');}
function renderLearn(){filter='all';$('app').innerHTML=`<h2>İlleri öğren</h2><div class="controls"><select id="learnFilter">${filterOptions()}</select><input id="search" type="search" placeholder="İl ara…" autocomplete="off" aria-label="İl ara"></div><p class="subtle" id="count"></p><div class="list" id="cities"></div>`;$('learnFilter').onchange=renderCities;$('search').oninput=renderCities;renderCities();}function renderCities(){let f=$('learnFilter').value,q=$('search').value.toLocaleLowerCase('tr');let arr=sorted(Object.keys(LOOKUP)).filter(c=>(f==='all'||LOOKUP[c]===Number(f))&&c.toLocaleLowerCase('tr').includes(q));$('count').textContent=`${arr.length} il gösteriliyor`;$('cities').innerHTML=arr.map(c=>`<div class="city"><b>${escapeHTML(c)}</b><span class="chip" style="background:${COLORS[LOOKUP[c]]}">${LOOKUP[c]}</span></div>`).join('')||'<div class="empty">Eşleşen il yok.</div>';}
function renderStats(){const total=Object.values(data).reduce((s,x)=>s+x.right+x.wrong,0),right=Object.values(data).reduce((s,x)=>s+x.right,0),missed=Object.keys(LOOKUP).filter(c=>data[c].missed);$('app').innerHTML=`<h2>Çalışma istatistikleri</h2><div class="statgrid"><div class="stat"><strong>${total}</strong><small>Yanıt</small></div><div class="stat"><strong>${total?Math.round(right/total*100):0}%</strong><small>Başarı</small></div><div class="stat"><strong>${missed.length}</strong><small>Tekrar edilecek il</small></div></div><h3>Tekrar edilecek iller</h3><div class="list">${sorted(missed).map(c=>`<div class="city"><b>${escapeHTML(c)}</b><span class="chip" style="background:${COLORS[LOOKUP[c]]}">${LOOKUP[c]}</span></div>`).join('')||'<p class="subtle">Henüz tekrar edilecek il yok.</p>'}</div><p class="note">Yanlış yaptığın bir il, sonraki doğru cevabında yanlışlar listesinden çıkar.</p><button class="secondary" id="clear" style="margin-top:20px">İstatistikleri sıfırla</button>`;$('clear').onclick=()=>{if(confirm('Tüm sınav geçmişini silmek istiyor musun?')){for(const c of Object.keys(LOOKUP))data[c]={right:0,wrong:0,missed:false};save();renderStats();}};}
$('legend').innerHTML=[1,2,3,4].map(r=>`<span><i class="dot" style="background:${COLORS[r]}"></i>${r}. Bölge • ${NAMES[r]} • ${REGIONS[r].length} il</span>`).join('');switchMode('quiz');if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
